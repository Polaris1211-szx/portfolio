name: Test and publish frontend image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build application
        run: |
          pnpm install --frozen-lockfile
          VITE_APP_VERSION="$GITHUB_SHA" pnpm build
      - name: Build image
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" --tag acc-system-frontend:test .
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push to ECR
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag acc-system-frontend:test "$registry/$REPOSITORY:$GITHUB_SHA"
          docker tag acc-system-frontend:test "$registry/$REPOSITORY:main"
          docker push "$registry/$REPOSITORY:$GITHUB_SHA"
          docker push "$registry/$REPOSITORY:main"
